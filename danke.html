<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vielen Dank | Raumkonzept Reinigung</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>

        body{
            margin:0;
            background:#f7f8fa;
            font-family:'Open Sans',sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .thanks-box{

            max-width:700px;
            background:#ffffff;
            padding:60px;
            border-radius:18px;
            box-shadow:0 15px 45px rgba(0,0,0,.08);
            text-align:center;

        }

        .check{

            width:95px;
            height:95px;
            border-radius:50%;
            background:#2e7d32;
            color:white;
            font-size:46px;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0 auto 30px;

        }

        h1{

            font-family:'Poppins',sans-serif;
            color:#183b2b;
            font-size:40px;
            margin-bottom:20px;

        }

        p{

            font-size:18px;
            line-height:1.7;
            color:#555;

        }

        .button{

            display:inline-block;
            margin-top:40px;
            padding:16px 34px;
            background:#183b2b;
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-weight:600;
            transition:.3s;

        }

        .button:hover{

            background:#c9a15a;

        }

    </style>

</head>

<body>

<div class="thanks-box">

    <div class="check">
        ✓
    </div>

    <h1>Vielen Dank!</h1>

    <p>

        Ihre Anfrage wurde erfolgreich übermittelt.

    </p>

    <p>

        Ich werde mich schnellstmöglich persönlich bei Ihnen melden.

    </p>

    <a href="index.html" class="button">

        Zurück zur Startseite

    </a>

</div>

</body>

</html>
